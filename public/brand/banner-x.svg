<!-- GammaDesk brand source. Text is set in Consolas; convert to
     outlines before handing this to anything that may not have it.
     Regenerate with: npm run brand -->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#f0a500" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="washMask"><rect width="1500" height="500" fill="url(#wash)"/></mask>
  </defs>

  <rect width="1500" height="500" fill="#0a0e17"/>
  <rect width="1500" height="500" fill="url(#grid)" mask="url(#washMask)"/>

  <circle cx="250" cy="240" r="112" fill="#f0a500"/>
  <text x="204.2" y="267.14" font-family="Consolas" font-size="173.67" font-weight="bold" fill="#0a0e17">&#947;</text>

  <text x="420" y="252" font-family="Consolas" font-size="100" font-weight="bold" fill="#ffffff">Gamma<tspan fill="#f0a500">Desk</tspan></text>
  <text x="424" y="306" font-family="Consolas" font-size="31" fill="#8494a8">Options data in plain English · gammadesk.app</text>
</svg>
